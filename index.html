  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background:
      radial-gradient(120% 100% at 18% 0%, #4a1235 0%, #2a0b26 46%, #140810 100%);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 背景光斑 ---------- */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(72px);
    pointer-events: none;
    z-index: 0;
  }
  .glow.a {
    width: 44vmax; height: 44vmax;
    left: -12vmax; top: -14vmax;
    background: #ff4f94;
    opacity: .42;
    animation: breathe 9s ease-in-out infinite;
  }
  .glow.b {
    width: 40vmax; height: 40vmax;
    right: -14vmax; bottom: -16vmax;
    background: #8452ff;
    opacity: .30;
    animation: breathe 11s ease-in-out infinite reverse;
  }
  .glow.c {
    width: 28vmax; height: 28vmax;
    left: 44%; top: 52%;
    background: #ff9a63;
    opacity: .16;
    animation: breathe 13s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }

  /* ---------- 爱心光晕 ---------- */
  #aura {
    position: fixed;
    left: 0; top: 0;
    width: 500px; height: 500px;
    border-radius: 50%;
    background:
      radial-gradient(closest-side, rgba(255, 132, 178, .58), rgba(255, 74, 142, .24) 46%, rgba(255, 74, 142, 0) 72%);
    filter: blur(38px);
    mix-blend-mode: screen;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.72);
    transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1);
    pointer-events: none;
    z-index: 1;
    will-change: opacity, transform;
  }
  #aura.on {
    opacity: .92;
    transform: translate(-50%, -50%) scale(1.04);
  }

  #pulse {
    position: fixed;
    left: 0; top: 0;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 1px solid rgba(255, 180, 212, .55);
    box-shadow:
      0 0 44px rgba(255, 118, 170, .35),
      inset 0 0 44px rgba(255, 118, 170, .16);
    opacity: 0;
    transform: translate(-50%, -50%) scale(.55);
    pointer-events: none;
    z-index: 1;
  }
  #pulse.go {
    animation: pulseRing 1.5s cubic-bezier(.2, .7, .3, 1) forwards;
  }
  @keyframes pulseRing {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.55); }
    18% { opacity: .9; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
  }

  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 46%, rgba(255, 238, 247, .55) 0%, rgba(255, 178, 214, .22) 30%, transparent 62%);
    opacity: 0;
    pointer-events: none;
    z-index: 8;
  }
  #flash.go { animation: flashOut 1s ease-out; }
  @keyframes flashOut {
    0% { opacity: 0; }
    14% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- 爱心卡片舞台 ---------- */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 3;
    transform: scale(1);
    transform-origin: 50% 50%;
    transition:
      transform .9s cubic-bezier(.2, .8, .25, 1),
      opacity .68s ease,
      filter .68s ease;
    will-change: transform, opacity, filter;
  }
  #stage.complete { transform: scale(1.035); }
  #stage.leaving {
    opacity: 0;
    transform: scale(1.14);
    filter: blur(8px);
  }

  .card {
    position: absolute;
    left: var(--left, 0);
    top: var(--top, 0);
    width: var(--w, 84px);
    height: var(--h, 56px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 3px 4px;
    border-radius: 12px;
    background: var(--card-bg, #fff5f7);
    border: 1px solid rgba(255, 255, 255, .72);
    box-shadow:
      0 10px 22px -14px rgba(0, 0, 0, .72),
      0 2px 5px -2px rgba(0, 0, 0, .28),
      inset 0 1px 0 rgba(255, 255, 255, .95);
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(var(--fx, 0px), var(--fy, 0px), 0) scale(.32) rotate(var(--fr, 0deg));
    transform-origin: 50% 50%;
    transition:
      opacity .52s ease,
      transform .8s cubic-bezier(.17, .86, .28, 1.12),
      box-shadow .35s ease;
    will-change: transform, opacity;
  }

  /* 纸面高光 */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, 0) 52%);
    pointer-events: none;
  }

  /* 左侧彩色书签条 */
  .card::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 12px 0 0 12px;
    background: var(--accent, #e8547f);
    opacity: .9;
  }

  .card.in {
    opacity: 1;
    pointer-events: auto;
    transform: translate3d(0, 0, 0) scale(1) rotate(var(--rot, 0deg));
  }

  #stage.complete .card {
    box-shadow:
      0 10px 22px -14px rgba(0, 0, 0, .72),
      0 0 20px rgba(255, 122, 172, .30),
      inset 0 1px 0 rgba(255, 255, 255, .95);
  }

  .card .mini {
    font-size: calc(var(--fs, 12px) * .62);
    line-height: 1;
    color: var(--accent, #e8547f);
    opacity: .88;
    transform: translateY(.5px);
  }

  .card .txt {
    font-size: var(--fs, 12px);
    line-height: 1.22;
    font-weight: 600;
    letter-spacing: .01em;
    color: #54243c;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-wrap: balance;
  }

  #stage.no-mini .card .mini { display: none; }

  @media (hover: hover) {
    .card.in:hover {
      transform: translate3d(0, 0, 0) scale(1.09) rotate(0deg);
      z-index: 20;
      box-shadow:
        0 18px 34px -16px rgba(0, 0, 0, .78),
        0 0 24px rgba(255, 122, 172, .34),
        inset 0 1px 0 rgba(255, 255, 255, .98);
    }
  }
  .card.in:active {
    transform: translate3d(0, 0, 0) scale(.94) rotate(var(--rot, 0deg));
  }

  /* ---------- 漂浮的小心心 ---------- */
  #heartLayer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 2;
  }
  .float-heart {
    position: absolute;
    bottom: -48px;
    animation: rise linear forwards;
    filter: drop-shadow(0 0 7px rgba(255, 110, 165, .45));
    will-change: transform, opacity;
  }
  @keyframes rise {
    0% {
      transform: translate3d(0, 0, 0) rotate(-10deg);
      opacity: 0;
    }
    12% { opacity: var(--maxo, .72); }
    82% { opacity: var(--maxo, .72); }
    100% {
      transform: translate3d(var(--drift, 0px), -110vh, 0) rotate(22deg);
      opacity: 0;
    }
  }

  /* ---------- 天女散花般的字句 ---------- */
  #wordLayer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 4;
  }

  .word {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    line-height: 1;
    font-weight: 700;
    letter-spacing: .05em;
    animation: petalFall var(--dur, 9s) linear forwards;
    will-change: transform, opacity;
    transform: translate3d(0, -14vh, 0);
  }
  .word.hero { font-weight: 800; letter-spacing: .11em; }
  .word.petal { font-weight: 400; letter-spacing: 0; }

  @keyframes petalFall {
    0% {
      transform: translate3d(0, -14vh, 0) rotate(var(--r0, 0deg));
      opacity: 0;
    }
    9% { opacity: var(--op, .8); }
    25% {
      transform: translate3d(var(--s1, 0px), 21vh, 0) rotate(calc(var(--r0, 0deg) + 6deg));
      opacity: var(--op, .8);
    }
    50% {
      transform: translate3d(var(--s2, 0px), 48vh, 0) rotate(calc(var(--r0, 0deg) + 13deg));
      opacity: var(--op, .8);
    }
    75% {
      transform: translate3d(var(--s3, 0px), 79vh, 0) rotate(calc(var(--r0, 0deg) + 20deg));
      opacity: var(--op, .8);
    }
    88% { opacity: var(--op, .8); }
    100% {
      transform: translate3d(var(--drift, 0px), 114vh, 0) rotate(var(--r1, 20deg));
      opacity: 0;
    }
  }

  /* 点击爆开的心心 */
  .burst-heart {
    position: fixed;
    z-index: 70;
    pointer-events: none;
    line-height: 1;
    animation: burst .95s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  .burst-heart.big { animation-duration: 1.5s; }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15) rotate(40deg);
      opacity: 0;
    }
  }

  /* ---------- 提示 & 重播 ---------- */
  .hint {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 14px);
    z-index: 30;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: .08em;
    color: #ffe2ee;
    background: rgba(60, 16, 44, .42);
    border: 1px solid rgba(255, 200, 224, .26);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .55s ease, transform .55s ease;
  }
  .hint.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #replay {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 200, 224, .3);
    background: rgba(60, 16, 44, .42);
    color: #ffd4e5;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity .45s ease, background .25s ease, transform .25s ease;
  }
  #replay.show {
    opacity: 1;
    pointer-events: auto;
  }
  #replay:hover {
    background: rgba(255, 120, 170, .28);
    transform: scale(1.08);
  }
  #replay:active { transform: scale(.94); }
  #replay.spin { animation: spin .6s ease; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ---------- 背景音乐开关 ---------- */
  #music {
    position: fixed;
    right: 18px;
    top: calc(18px + env(safe-area-inset-top, 0px));
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 200, 224, .3);
    background: rgba(60, 16, 44, .42);
    color: #ffd4e5;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: opacity .45s ease, background .25s ease, transform .25s ease, box-shadow .6s ease;
  }
  #music.ready {
    opacity: 1;
    pointer-events: auto;
  }
  #music.playing {
    background: rgba(255, 120, 170, .22);
    box-shadow: 0 0 18px rgba(255, 122, 172, .26);
  }
  #music:hover { background: rgba(255, 120, 170, .3); transform: scale(1.08); }
  #music:active { transform: scale(.94); }

  /* 还没开始播放时，轻轻跳一下，提示可以点 */
  #music.waiting { animation: musicNudge 2.6s ease-in-out infinite; }
  @keyframes musicNudge {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 122, 172, 0); }
    50% { transform: scale(1.06); box-shadow: 0 0 20px rgba(255, 122, 172, .34); }
  }

  .eq {
    display: flex;
    align-items: flex-end;
    gap: 2.5px;
    height: 16px;
  }
  .eq i {
    display: block;
    width: 2.5px;
    height: 5px;
    border-radius: 2px;
    background: currentColor;
    transition: height .3s ease, opacity .3s ease;
  }
  #music:not(.playing) .eq i { opacity: .5; }
  #music:not(.playing) .eq i:nth-child(2) { height: 9px; }
  #music.playing .eq i { animation: eqBounce .95s ease-in-out infinite; }
  #music.playing .eq i:nth-child(2) { animation-delay: .18s; }
  #music.playing .eq i:nth-child(3) { animation-delay: .36s; }
  @keyframes eqBounce {
    0%, 100% { height: 4px; }
    50% { height: 15px; }
  }

  @media (max-width: 560px) {
    .hint { bottom: 15px; font-size: 11px; padding: 8px 14px; }
    #replay { right: 12px; bottom: 12px; width: 40px; height: 40px; }
    #music {
      right: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      width: 40px;
      height: 40px;
    }
  }

  /* ---------- 开场告白 ---------- */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #14070f;
    opacity: 1;
    transition: opacity 1.3s ease, visibility 1.3s ease;
  }
  #intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ---------- 开场背景：多张情侣照片交叉拼贴 ---------- */
  .intro-collage {
    position: absolute;
    inset: -12%;
    z-index: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: clamp(6px, 1.4vmin, 16px);
    padding: 3vmin;
    transform: rotate(-6deg) scale(1.18);
    pointer-events: none;
    filter: saturate(1.06) brightness(.86);
  }
  .intro-photo {
    position: relative;
    justify-self: center;
    align-self: center;
    width: calc(100% + 2.4vmin);
    height: calc(100% + 2.4vmin);
    border-radius: clamp(8px, 1.3vmin, 18px);
    border: clamp(3px, .48vmin, 7px) solid rgba(255, 246, 250, .94);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow:
      0 18px 42px rgba(0, 0, 0, .58),
      0 4px 12px rgba(0, 0, 0, .42);
    opacity: 0;
    transform: rotate(var(--rot, 0deg)) translate3d(0, var(--off, 0px), 0) scale(var(--sc, 1.06));
    animation: photoFloat var(--dur, 9s) ease-in-out var(--delay, 0s) infinite alternate;
    will-change: transform, opacity;
    transition: opacity 1.2s ease;
  }
  .intro-photo.on { opacity: .96; }
  .intro-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(140deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 46%);
    pointer-events: none;
  }
  @keyframes photoFloat {
    0% {
      transform: rotate(var(--rot, 0deg)) translate3d(0, var(--off, 0px), 0) scale(var(--sc, 1.06));
    }
    100% {
      transform: rotate(calc(var(--rot, 0deg) + 2.2deg)) translate3d(var(--fx, 6px), calc(var(--off, 0px) + var(--fy, -10px)), 0) scale(calc(var(--sc, 1.06) + .035));
    }
  }

  .intro-veil {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(66% 58% at 50% 47%, rgba(18, 5, 14, .48) 0%, rgba(18, 5, 14, .34) 55%, rgba(12, 3, 10, .80) 100%),
      linear-gradient(180deg, rgba(28, 8, 22, .48) 0%, rgba(28, 8, 22, .12) 42%, rgba(20, 6, 16, .72) 100%);
    pointer-events: none;
  }

  #introHearts {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }
  .intro-heart {
    position: absolute;
    bottom: -44px;
    color: #ffd0e2;
    line-height: 1;
    animation: introRise linear forwards;
    filter: drop-shadow(0 0 10px rgba(255, 120, 170, .6));
    will-change: transform, opacity;
  }
  @keyframes introRise {
    0% { transform: translate3d(0, 0, 0) rotate(-12deg); opacity: 0; }
    15% { opacity: var(--o, .7); }
    82% { opacity: var(--o, .7); }
    100% { transform: translate3d(var(--dx, 0px), -108vh, 0) rotate(24deg); opacity: 0; }
  }

  .intro-content {
    position: absolute;
    inset: 0;
    z-index: 4;
    width: 100%;
    height: 100%;
    padding: 0;
    display: block;
    text-align: center;
    pointer-events: none;
  }

  /* 三幕文字：依次出现、停留、消失 */
  .intro-slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 4vw;
    opacity: 0;
    visibility: hidden;
    transform: translateY(3vh) scale(.96);
    filter: blur(10px);
    transition:
      opacity .9s ease,
      transform .9s cubic-bezier(.2, .8, .25, 1),
      filter .9s ease,
      visibility .9s;
  }
  .intro-slide.on {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
  .intro-slide.gone {
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6vh) scale(1.05);
    filter: blur(12px);
  }

  /* 毛笔书法字体 */
  .intro-name,
  .intro-line,
  .intro-end {
    font-family: "BrushLove", "Ma Shan Zheng", "Zhi Mang Xing", "STXingkai", "华文行楷", "KaiTi", "STKaiti", "Kaiti SC", "楷体", "SimSun", serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .intro-name {
    display: flex;
    justify-content: center;
    gap: clamp(0px, .7vw, 10px);
    font-size: clamp(76px, 19.5vw, 240px);
    line-height: 1;
    letter-spacing: .02em;
    color: #fff7fb;
    text-shadow:
      0 0 22px rgba(255, 154, 196, .85),
      0 0 70px rgba(255, 92, 158, .55),
      0 8px 34px rgba(0, 0, 0, .55);
  }
  .intro-name span {
    display: inline-block;
    opacity: 0;
    transform: scale(2.2) rotate(-9deg);
    filter: blur(18px);
    will-change: transform, opacity, filter;
  }
  .intro-name span.show {
    animation: introStamp .88s cubic-bezier(.16, .9, .24, 1.25) forwards;
  }
  @keyframes introStamp {
    0% { opacity: 0; transform: scale(2.2) rotate(-9deg); filter: blur(18px); }
    52% { opacity: 1; transform: scale(.93) rotate(1.6deg); filter: blur(0); }
    74% { transform: scale(1.035) rotate(-.7deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
  }

  .intro-line {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: clamp(0px, .35vw, 5px);
    font-size: clamp(40px, 10.5vw, 126px);
    line-height: 1.12;
    letter-spacing: .04em;
    color: #ffd9e8;
    text-shadow:
      0 0 18px rgba(255, 150, 194, .8),
      0 0 52px rgba(255, 88, 154, .48),
      0 6px 24px rgba(0, 0, 0, .5);
    transition: transform .55s cubic-bezier(.2, .8, .25, 1);
    will-change: transform;
  }
  .intro-line span {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px) scale(.55);
    filter: blur(10px);
    will-change: transform, opacity, filter;
  }
  .intro-line span.show {
    animation: introPop .8s cubic-bezier(.2, .9, .3, 1.3) forwards;
  }
  @keyframes introPop {
    0% { opacity: 0; transform: translateY(18px) scale(.55); filter: blur(10px); }
    65% { opacity: 1; transform: translateY(-3px) scale(1.08); filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .intro-end {
    display: flex;
    justify-content: center;
    gap: clamp(0px, .35vw, 4px);
    font-size: clamp(44px, 12vw, 144px);
    line-height: 1.05;
    letter-spacing: .03em;
    color: #fff2f8;
    text-shadow:
      0 0 24px rgba(255, 214, 232, .9),
      0 0 64px rgba(255, 84, 150, .8),
      0 0 120px rgba(255, 84, 150, .45);
    opacity: 0;
    transform: scale(.7);
    filter: blur(12px);
  }
  .intro-end.show {
    animation:
      introFinal 1.2s cubic-bezier(.18, .9, .25, 1.2) forwards,
      introBeat 1.6s ease-in-out 1.2s infinite;
  }
  @keyframes introFinal {
    0% { opacity: 0; transform: scale(.7); filter: blur(12px); }
    55% { opacity: 1; transform: scale(1.08); filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes introBeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.045); }
    28% { transform: scale(1); }
    42% { transform: scale(1.03); }
  }

  #skipIntro {
    position: absolute;
    right: clamp(14px, 3vw, 26px);
    bottom: calc(clamp(14px, 3vw, 26px) + env(safe-area-inset-bottom, 0px));
    z-index: 5;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 210, 230, .28);
    background: rgba(60, 16, 44, .36);
    color: #ffd9e8;
    font-size: 12px;
    letter-spacing: .14em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease, background .25s ease, transform .25s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #skipIntro.show { opacity: .92; pointer-events: auto; }
  #skipIntro:hover { background: rgba(255, 120, 170, .24); transform: scale(1.04); }
  #skipIntro:active { transform: scale(.95); }

  @media (max-width: 640px) {
    .intro-collage {
      inset: -16%;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: clamp(4px, 1vmin, 10px);
      padding: 2vmin;
      transform: rotate(-7deg) scale(1.22);
    }
    .intro-photo {
      width: calc(100% + 2vmin);
      height: calc(100% + 2vmin);
    }
    .intro-slide { padding: 8vh 3vw; }
    .intro-name { font-size: clamp(68px, 21vw, 132px); }
    .intro-line { font-size: clamp(36px, 11.5vw, 76px); }
    .intro-end { font-size: clamp(40px, 13vw, 88px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .float-heart { display: none; }
    .card { transition-duration: .01s; }

    }
    var r = parseInt(h.slice(0, 2), 16);

    return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";

      var sin = Math.sin(t);
      points.push([
        16 * sin * sin * sin,
        13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
      ]);
    }
    return points;
  })();

  /* 曲线坐标：左右约 -16 ~ 16，上下约 -17 ~ 11.92 */
  function pointInHeart(x, y) {
    var inside = false;
    for (var i = 0, j = HEART_OUTLINE.length - 1; i < HEART_OUTLINE.length; j = i++) {
      var xi = HEART_OUTLINE[i][0];
      var yi = HEART_OUTLINE[i][1];
      var xj = HEART_OUTLINE[j][0];
      var yj = HEART_OUTLINE[j][1];
      if (((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)) {

      }

    return inside;
  }

  function buildLayout() {
    var W = window.innerWidth;
    var H = window.innerHeight;
    var portrait = W < H;
    var compact = Math.min(W, H) < 560;

    var maxW = compact ? (portrait ? W * 0.90 : W * 0.64) : W * 0.70;
    var maxH = compact ? (portrait ? H * 0.60 : H * 0.68) : H * 0.84;
    var s = Math.max(7, Math.min(maxW / 32, maxH / 28.923));

    /* 心形的视觉中心 */
    var cx = W / 2;
    var cy = H * 0.47;
    var heartW = 32 * s;
    var heartH = 28.923 * s;

    /* 固定列数，保证字条之间留出呼吸的缝 */
    var nCols;
    if (!compact) nCols = 9;
    else nCols = heartW < 320 ? 5 : 7;

    var gapX = Math.max(5, heartW * 0.012);
    var cardW = clamp((heartW - (nCols - 1) * gapX) / nCols, compact ? 38 : 64, 190);
    var ratio = compact ? 0.68 : 0.66;
    var cardH = cardW * ratio;
    var gapY = Math.max(3, cardH * 0.10);
    var span = (heartW - cardW) / (2 * s);
    var colStep = (2 * span) / (nCols - 1);

    var nRows = Math.max(5, Math.round(heartH / (cardH + gapY)));
    var rowStep = 28.923 / nRows;
    var rows = [];

    for (var r = 0; r < nRows; r++) {
      var curveY = 11.923 - (r + 0.5) * rowStep;
      var row = [];
      for (var i = 0; i < nCols; i++) {
        var curveX = -span + i * colStep;
        if (!pointInHeart(curveX, curveY)) continue;
        row.push({
          x: cx + curveX * s + (Math.random() - 0.5) * gapX * 0.26,
          y: cy - (curveY + 2.5385) * s + (Math.random() - 0.5) * gapY * 0.30,
          rot: Math.random() * 5.2 - 2.6
        });
      }
      if (row.length) rows.push(row);
    }

    /* 从心尖开始，一层一层往上摆 */
    rows.reverse();
    var items = [];
    for (var j = 0; j < rows.length; j++) {
      shuffle(rows[j]);
      items = items.concat(rows[j]);
    }

      W: W,
      H: H,
      cx: cx,
      cy: cy,
      s: s,
      cardW: cardW,
      cardH: cardH,
      items: items,
      colCount: nCols,
      rowCount: rows.length,
      heartW: heartW,
      heartH: heartH,
      fontSize: clamp(cardW * 0.155, 8.5, 16),
      compact: compact

    raining = true;

    hint.classList.add("show");
    flash.classList.add("go");
    bigBurst(heartPoint.x, heartPoint.y, 34);

    later(function () { hint.classList.remove("show"); }, 5600);
    later(function () { replay.classList.add("show"); }, 900);
    later(function () { flash.classList.remove("go"); }, 1100);

    var bag = shuffle(LOVE_PHRASES.slice());
    var index = 0;

    function nextPhrase() {
      var text = bag[index % bag.length];
      index++;
      if (index % bag.length === 0) bag = shuffle(bag);
      return text;
    }

    /* 先铺一层，让画面立刻满起来；竖向均匀铺开，避免挤成一团 */
    rainSlot = 0;
    var prewarmWords = 22;
    for (var i = 0; i < prewarmWords; i++) {
      spawnWord(nextPhrase(), ((i + 0.5) / prewarmWords) * 0.9);
    }
    var prewarmPetals = 10;
    for (var j = 0; j < prewarmPetals; j++) {
      spawnPetal(((j + 0.5) / prewarmPetals) * 0.9);
    }

    var myGeneration = generation;
    var featuredIndex = 0;

    function loop() {
      if (myGeneration !== generation || !raining) return;

      var count = 2;
      if (Math.random() < 0.40) count++;
      if (Math.random() < 0.08) count++;

      for (var n = 0; n < count; n++) {
        (function (delay) {
          setTimeout(function () {
            if (myGeneration !== generation || !raining) return;
            if (Math.random() < 0.24) {
              spawnPetal(false);
            } else if (Math.random() < 0.08) {
              spawnWord(FEATURED_PHRASES[featuredIndex++ % FEATURED_PHRASES.length], false);
            } else {
              spawnWord(nextPhrase(), false);
            }
          }, delay);
        })(n * 65);
      }

      rainTimer = setTimeout(loop, 280 + Math.random() * 220);
    }

    loop();
  }

  function stopRain() {
    raining = false;
    if (rainTimer) {
      clearTimeout(rainTimer);
      rainTimer = null;
    }
    wordLayer.innerHTML = "";
  }

  function spawnWord(text, prewarm) {
    if (!raining) return;
    if (wordLayer.childElementCount > 76) return;

    var W = window.innerWidth;
    var H = window.innerHeight;
    var el = document.createElement("span");
    el.className = "word";

    var roll = Math.random();
    var base = W < 560 ? 12.5 : 15.5;
    var size;
    var featured = FEATURED_PHRASES.indexOf(text) !== -1;

    if (featured) {
      size = Math.min(base * (2.15 + Math.random() * 0.35), W * 0.13);
      el.classList.add("hero");
    } else if (roll < 0.09 && text.length <= 8) {
      size = Math.min(base * (2.0 + Math.random() * 0.55), W * 0.11);
      el.classList.add("hero");
    } else if (roll < 0.38) {
      size = base * (1.18 + Math.random() * 0.28);
    } else {
      size = base * (0.88 + Math.random() * 0.26);
    }

    /* 太长的句子就收小一点，别冲出屏幕 */
    var fitSize = (W - 28) / Math.max(2, text.length * 0.96);
    size = Math.max(8, Math.min(size, fitSize));

    var color = WORD_COLORS[Math.floor(Math.random() * WORD_COLORS.length)];
    var dur = 8.2 + Math.random() * 4.6;
    var estimated = Math.max(18, text.length * size * 0.96);
    var maxX = Math.max(6, W - estimated - 10);
    var columns = W < 560 ? 4 : 7;
    var column = rainSlot++ % columns;
    var lane = maxX / columns;
    var x = (column + 0.5) * lane + (Math.random() - 0.5) * lane * 0.72;
    x = clamp(x, 4, maxX);

    el.textContent = text;
    el.style.fontSize = size.toFixed(1) + "px";
    el.style.color = color;

  /* ---------------- 背景音乐：《金玉良缘》高潮循环 ---------------- */
  var MUSIC = {
    /* 音频文件放在 love.html 同目录，按顺序尝试，命中一个就停 */
    files: ["bgm.mp3", "金玉良缘.mp3", "music.mp3"],
    /* 副歌（高潮）时间点，单位：秒。按 3:40 原版取 1:16.5 ~ 1:41.2 */
    chorusStart: 76.5,
    chorusEnd: 101.2,
    /* 整首时长基准，明显更长/更短的版本会按比例换算高潮位置 */
    baseDuration: 220,
    /* 时长落在这个区间（3:15 ~ 3:55）时，高潮位置和原版基本一致，不换算 */
    fixedRange: [195, 235],
    /* 如果文件短于这个秒数，说明它本身就是高潮片段，就整段循环 */
    clipDuration: 70,
    volume: 0.55,
    fadeIn: 1600
  };

  var musicIndex = 0;
  var musicReady = false;
  var musicPausedByUser = false;
  var gestureArmed = false;
  var chorus = { start: 0, end: 0 };
  var chorusSeeking = false;
  var fadeTimer = null;

  function loadNextTrack() {
    /* 音频已内嵌（单文件版）时直接使用，不再去找外部文件 */
    if (bgm.getAttribute("src")) return;
    if (musicIndex >= MUSIC.files.length) {
      if (window.console && console.info) {
        console.info(
          "[love] 没有找到背景音乐。把《金玉良缘》高潮片段保存为 “" +
          MUSIC.files[0] + "”，放在 love.html 同一个文件夹里即可。"
        );
      }
      return;
    }
    bgm.src = MUSIC.files[musicIndex++];
    try { bgm.load(); } catch (e) {}
  }

  /* 根据整首时长，算出这首歌的高潮区间 */
  function chorusWindow() {
    var dur = bgm.duration;
    if (!isFinite(dur) || dur <= 0) return { start: 0, end: 0 };
    if (dur < MUSIC.clipDuration) return { start: 0, end: 0 };

    var scale = 1;
    if (dur < MUSIC.fixedRange[0] || dur > MUSIC.fixedRange[1]) {
      scale = dur / MUSIC.baseDuration;
    }
    var start = MUSIC.chorusStart * scale;
    var end = MUSIC.chorusEnd * scale;

    if (start > dur - 8) start = 0;
    if (!(end > start + 4) || end > dur) end = 0;
    return { start: start, end: end };
  }

  function jumpToChorus() {
    if (!musicReady || !isFinite(bgm.duration) || bgm.duration <= 0) return;
    chorusSeeking = true;
    try { bgm.currentTime = chorus.start; } catch (e) {}
    setTimeout(function () { chorusSeeking = false; }, 360);
  }

  function fadeVolume(target, ms) {
    if (fadeTimer) {
      clearInterval(fadeTimer);
      fadeTimer = null;
    }
    var from = bgm.volume;
    var began = Date.now();
    fadeTimer = setInterval(function () {
      var p = Math.min(1, (Date.now() - began) / ms);
      try { bgm.volume = Math.max(0, Math.min(1, from + (target - from) * p)); } catch (e) {}
      if (p >= 1) {
        clearInterval(fadeTimer);
        fadeTimer = null;
      }
    }, 40);
  }

  function attemptPlay() {
    if (!musicReady || musicPausedByUser) return;
    if (!bgm.paused) return;
    try { bgm.volume = 0; } catch (e) {}
    var p;
    try {
      p = bgm.play();
    } catch (e) {
      musicBtn.classList.add("waiting");
      armGesture();
      return;
    }
    if (p && typeof p.catch === "function") {
      p.catch(function () {
        /* 浏览器不允许自动播放：等用户第一次点屏幕/按键再开始 */
        if (musicPausedByUser) return;
        musicBtn.classList.add("waiting");
        armGesture();
      });
    }
  }

  function gestureStart(ev) {
    if (ev && ev.target && ev.target.closest && ev.target.closest("#music")) return;
    musicPausedByUser = false;
    musicBtn.classList.remove("waiting");
    attemptPlay();
  }

  function armGesture() {
    if (gestureArmed) return;
    gestureArmed = true;
    window.addEventListener("pointerdown", gestureStart, true);
    window.addEventListener("keydown", gestureStart, true);
    window.addEventListener("touchstart", gestureStart, { capture: true, passive: true });
  }

  function disarmGesture() {
    if (!gestureArmed) return;
    gestureArmed = false;
    window.removeEventListener("pointerdown", gestureStart, true);
    window.removeEventListener("keydown", gestureStart, true);
    window.removeEventListener("touchstart", gestureStart, true);
  }

  function toggleMusic() {
    if (!musicReady) return;
    if (bgm.paused) {
      musicPausedByUser = false;
      musicBtn.classList.remove("waiting");
      attemptPlay();
    } else {
      musicPausedByUser = true;
      bgm.pause();
    }
  }

  musicBtn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    toggleMusic();
  });

  bgm.addEventListener("error", function () {
    if (musicReady) return;
    loadNextTrack();
  });

  bgm.addEventListener("loadedmetadata", function () {
    musicReady = true;
    chorus = chorusWindow();
    jumpToChorus();
    musicBtn.classList.add("ready");
    attemptPlay();
  });

  /* 有些文件（或流式加载）时长会晚一点才确定，确定后再校准高潮位置 */
  bgm.addEventListener("durationchange", function () {
    if (!musicReady) return;
    if (!isFinite(bgm.duration) || bgm.duration <= 0) return;
    var next = chorusWindow();
    if (next.start === chorus.start && next.end === chorus.end) return;
    chorus = next;
    if (chorus.start && bgm.currentTime + 0.5 < chorus.start) jumpToChorus();
  });

  bgm.addEventListener("canplay", function () {
    if (!musicReady) return;
    if (chorus.start && bgm.currentTime + 1 < chorus.start) jumpToChorus();
  });

  bgm.addEventListener("play", function () {
    musicBtn.classList.add("playing");
    musicBtn.classList.remove("waiting");
    musicBtn.setAttribute("aria-pressed", "true");
    disarmGesture();
    fadeVolume(MUSIC.volume, MUSIC.fadeIn);
  });

  bgm.addEventListener("pause", function () {
    musicBtn.classList.remove("playing");
    musicBtn.setAttribute("aria-pressed", "false");
  });

  /* 只循环高潮这一段 */
  bgm.addEventListener("timeupdate", function () {
    if (chorusSeeking || !musicReady) return;
    var t = bgm.currentTime;
    if (chorus.end && t >= chorus.end - 0.12) {
      jumpToChorus();
    } else if (chorus.start && !bgm.paused && t + 0.25 < chorus.start) {
      jumpToChorus();
    }
  });

  bgm.addEventListener("ended", function () {
    jumpToChorus();
    if (!musicPausedByUser) attemptPlay();
  });

  loadNextTrack();

  var intro = document.getElementById("intro");
  var introHearts = document.getElementById("introHearts");
  var introCollage = document.getElementById("introCollage");
  var skipIntro = document.getElementById("skipIntro");
  var introNameChars = document.querySelectorAll("#introName span");
  var introLine = document.getElementById("introLine");
  var introLineChars = document.querySelectorAll("#introLine span");
  var introEnd = document.getElementById("introEnd");
  var introSlideName = document.getElementById("introSlideName");
  var introSlideLine = document.getElementById("introSlideLine");
  var introSlideEnd = document.getElementById("introSlideEnd");

  var introTimers = [];
  var introDone = false;
  var introHeartTimer = null;

  /* 拼贴照片的排列参数：旋转、缩放、上下错位，形成交叉叠放的感觉 */
  var INTRO_ROTS = [-8, 6.5, -5.5, 9, -8.5, 4.5, -7.5, 8, -4.5, 10, -7, 5.5];
  var INTRO_SCALES = [1.05, 1.11, 1.02, 1.08, 1.13, 1.03, 1.09, 1.06, 1.12, 1.07, 1.08, 1.1];
  var INTRO_OFFSETS = [0, 9, -7, 5, -10, 7, -4, 10, -8, 4, -6, 8];
  var INTRO_CROPS = ["50% 34%", "44% 48%", "58% 44%", "50% 58%", "46% 38%", "56% 52%"];

  function introLater(fn, ms) {
    var id = setTimeout(function () {
      if (introDone) return;
      fn();
    }, ms);
    introTimers.push(id);
    return id;
  }

  function clearIntroTimers() {
    for (var i = 0; i < introTimers.length; i++) clearTimeout(introTimers[i]);
    introTimers = [];
  }

  /* 把情侣照片做成一张张相片，旋转、错位、叠在一起铺满背景 */
  function buildIntroCollage() {
    if (!introCollage || !INTRO_PHOTOS.length) return;
    introCollage.innerHTML = "";

    for (var i = 0; i < 12; i++) {
      (function (index) {
        var card = document.createElement("div");
        card.className = "intro-photo";
        var photo = INTRO_PHOTOS[(index * 2 + 1) % INTRO_PHOTOS.length];
        card.style.backgroundImage = 'url("' + photo + '")';
        card.style.backgroundPosition = INTRO_CROPS[index % INTRO_CROPS.length];
        card.style.setProperty("--rot", INTRO_ROTS[index % INTRO_ROTS.length] + "deg");
        card.style.setProperty("--sc", INTRO_SCALES[index % INTRO_SCALES.length]);
        card.style.setProperty("--off", INTRO_OFFSETS[index % INTRO_OFFSETS.length] + "px");
        card.style.setProperty("--fx", (4 + (index % 5) * 3) + "px");
        card.style.setProperty("--fy", (-8 - (index % 4) * 4) + "px");
        card.style.setProperty("--dur", (8.5 + (index % 5) * 1.4).toFixed(1) + "s");
        card.style.setProperty("--delay", (-(index % 7) * 1.1).toFixed(1) + "s");
        card.style.zIndex = String(1 + (index % 5));
        introCollage.appendChild(card);

        introLater(function () { card.classList.add("on"); }, 80 + index * 65);
      })(i);
    }
  }

  function spawnIntroHeart() {
    if (introDone) return;
    if (introHearts.childElementCount > 22) return;
    var el = document.createElement("span");
    el.className = "intro-heart";
    el.textContent = Math.random() < 0.75 ? "♥" : "♡";
    el.style.left = (Math.random() * 100).toFixed(2) + "vw";
    el.style.fontSize = (10 + Math.random() * 20).toFixed(1) + "px";
    el.style.setProperty("--dx", (Math.random() * 100 - 50).toFixed(0) + "px");
    el.style.setProperty("--o", (0.25 + Math.random() * 0.5).toFixed(2));
    el.style.animationDuration = (8 + Math.random() * 7).toFixed(1) + "s";
    introHearts.appendChild(el);
    el.addEventListener("animationend", function () { this.remove(); });
  }

  /* 让已经出现的字始终保持在正中间，后面的字再一个个补上来 */
  function centerIntroLineProgress(visible) {
    var total = introLineChars.length;
    var hidden = total - visible;
    if (hidden <= 0) {
      introLine.style.transform = "translateX(0px)";
      return;
    }
    var per = introLine.offsetWidth / total;
    introLine.style.transform = "translateX(" + (hidden * per / 2).toFixed(1) + "px)";
  }

  function startIntro() {
    introDone = false;
    clearIntroTimers();

    var i;
    for (i = 0; i < introNameChars.length; i++) introNameChars[i].classList.remove("show");
    for (i = 0; i < introLineChars.length; i++) introLineChars[i].classList.remove("show");
    introLine.style.transform = "translateX(0px)";
    introEnd.classList.remove("show");
    skipIntro.classList.remove("show");

    introSlideName.className = "intro-slide";
    introSlideLine.className = "intro-slide";
    introSlideEnd.className = "intro-slide";

    introLater(function () { skipIntro.classList.add("show"); }, 2000);

    /* 第一幕：喻雪芹，一个字一个字重重印上去，停一会儿再淡出 */
    var nameStart = 650;
    var nameStep = 820;
    introSlideName.classList.add("on");
    for (i = 0; i < introNameChars.length; i++) {
      (function (el, delay) {
        introLater(function () { el.classList.add("show"); }, delay);
      })(introNameChars[i], nameStart + i * nameStep);
    }

    var nameShownEnd = nameStart + (introNameChars.length - 1) * nameStep + 800;
    var nameFade = nameShownEnd + 900;

    introLater(function () {
      introSlideName.classList.remove("on");
      introSlideName.classList.add("gone");
    }, nameFade);

    /* 第二幕：朱宇行爱你，等名字完全消失后再出现 */
    var lineStart = nameFade + 820;
    introLater(function () { introSlideLine.classList.add("on"); }, lineStart - 520);
    for (i = 0; i < introLineChars.length; i++) {
      (function (el, delay, visible) {
        introLater(function () {
          el.classList.add("show");
          centerIntroLineProgress(visible);
        }, delay);
      })(introLineChars[i], lineStart + i * 760, i + 1);
    }

    var lineShownEnd = lineStart + (introLineChars.length - 1) * 760 + 760;
    var lineFade = lineShownEnd + 900;

    introLater(function () {
      introSlideLine.classList.remove("on");
      introSlideLine.classList.add("gone");
    }, lineFade);

    /* 第三幕：永远爱你！ */
    var endStart = lineFade + 780;
    introLater(function () {
      introSlideEnd.classList.add("on");
      introEnd.classList.add("show");
    }, endStart);
    introLater(finishIntro, endStart + 3600);

    /* 照片前飘着的小心心 */
    for (i = 0; i < 6; i++) spawnIntroHeart();
    if (introHeartTimer) clearInterval(introHeartTimer);
    introHeartTimer = setInterval(spawnIntroHeart, 650);
  }

  function finishIntro() {
    if (introDone) return;
    introDone = true;
    clearIntroTimers();
    if (introHeartTimer) { clearInterval(introHeartTimer); introHeartTimer = null; }

    intro.classList.add("hide");
    skipIntro.classList.remove("show");

    /* 开场散场的同时，后面的爱心开始一颗颗拼起来 */
    startShow();

    setTimeout(function () {
      intro.style.display = "none";
      introHearts.innerHTML = "";
    }, 1400);
  }

  skipIntro.addEventListener("click", function (ev) {
    ev.stopPropagation();
    finishIntro();
  });

  /* ---------------- 重播 & 交互 ---------------- */
  replay.addEventListener("click", function (ev) {
    ev.stopPropagation();
    replay.classList.remove("spin");
    void replay.offsetWidth;
    replay.classList.add("spin");
    startShow();
    if (musicReady && !bgm.paused) jumpToChorus();
  });

  window.addEventListener("keydown", function (ev) {
    if (!introDone) return;
    if (ev.key === "r" || ev.key === "R") {
      startShow();
      if (musicReady && !bgm.paused) jumpToChorus();
    } else if (ev.key === "m" || ev.key === "M") {
      toggleMusic();
    }
  });

  window.addEventListener("pointerdown", function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest("#replay, #music")) return;
    var color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    burst(ev.clientX, ev.clientY, color);
  });

  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!introDone) return;
      var dw = Math.abs(window.innerWidth - lastW);
      var dh = Math.abs(window.innerHeight - lastH);
      if (dw < 2 && dh < 80) return;
      lastW = window.innerWidth;
      lastH = window.innerHeight;
      startShow();
    }, 360);
  });

  /* ---------------- 启动 ---------------- */
  startIntro();
  buildIntroCollage();

  for (var k = 0; k < 14; k++) {
    setTimeout(spawnHeart, k * 170);
  }
  setInterval(spawnHeart, 700);
})();
</script>
</body>
</html>
